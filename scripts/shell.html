<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KNHANES Atlas</title>
  <meta name="description" content="KNHANES 2007–2024 phenome–exposome atlas and vibration of effects.">
  <meta name="atlas-build" content="__BUILD__">
  <style>__STYLE__</style>
  <script>window.knhanesSiteRoot=new URL('.',window.location.href).href;</script>
  <script src="./loader.js?v=__LOADER__" defer></script>
</head>
<body>
  <div id="atlas-shell">
    <a class="skip-link" href="#atlas-content">Skip to study</a>
    <header class="atlas-header">
      <a class="atlas-brand" href="#about">KNHANES Atlas</a>
      <nav aria-label="Atlas navigation">__NAV__</nav>
    </header>
    <div class="atlas-loading" id="atlas-loading">
      <span id="atlas-status" role="status" aria-live="polite">Preparing interactive analyses…</span>
      <button id="atlas-open" type="button" hidden>Open interactive atlas</button>
      <button id="atlas-retry" type="button" hidden>Reload</button>
    </div>
    <noscript><style>.atlas-loading{display:none}</style><p class="atlas-noscript">Enable JavaScript to open the interactive analyses. The study overview and downloads are available below.</p></noscript>
    <main id="atlas-content" tabindex="-1">
      <section id="about" aria-label="Study overview">__ABOUT__</section>
      <section id="downloads" aria-label="Results, figures and tables">
        <h1>Results, figures and tables</h1>
        <p><a href="__PUBLICATIONS__">Browse all figures and tables</a></p>
        <h2>Summary results</h2>
        <ul class="download-list">__RESULTS__</ul>
        <h2>Study figures</h2>
        __FIGURES__
        <h2>Study tables</h2>
        <p><a href="__WORKBOOK__" download="Supplementary_Tables_KNHANES.xlsx">Download complete workbook</a></p>
        <ul class="download-list">__TABLES__</ul>
        <button type="button" data-atlas-tab="Downloads">Explore joint exposure models</button>
      </section>
    </main>
  </div>
  <div id="root" class="atlas-staging" aria-hidden="true" inert></div>
</body>
</html>
